name: Refresh schedule

on:
  schedule:
    # 08:30 and 09:30 UTC. Exactly one of those is 4:30 AM in America/New_York.
    # Standard time: 3:30 AM and 4:30 AM ET. Daylight time: 4:30 AM and 5:30 AM ET.
    - cron: "30 8 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Fetch schedule
        run: node scripts/fetch-schedule.mjs

      - name: Publish Must Watch overrides
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: node scripts/publish-must-watch.mjs

      - name: Commit schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/schedule.json public/must-watch.json
          if git diff --cached --quiet; then
            echo "Schedule is unchanged."
          else
            git commit -m "Update TV schedule"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_BASE: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # A push from this workflow cannot start Deploy site. Publish here, in a
  # second job, so the artifact is listed before deploy-pages looks for it.
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
