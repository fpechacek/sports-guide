name: Refresh schedule

on:
  schedule:
    # 08:30 and 09:30 UTC. Exactly one of those is 4:30 AM in America/New_York.
    # Standard time: 3:30 AM and 4:30 AM ET. Daylight time: 4:30 AM and 5:30 AM ET.
    - cron: "30 8 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-schedule
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch schedule
        run: node scripts/fetch-schedule.mjs

      - name: Commit schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/schedule.json
          if git diff --cached --quiet; then
            echo "Schedule is unchanged."
            exit 0
          fi
          git commit -m "Update TV schedule"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
